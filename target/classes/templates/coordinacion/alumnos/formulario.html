<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Alumno')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title">
                <i class="fas fa-user-graduate me-2 text-info"></i>
                <span th:text="${alumno.id == null} ? 'Nuevo Alumno' : 'Editar Alumno'"></span>
            </h5>
            <a th:href="@{/coordinacion/alumnos}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="content-area">
            <div class="card" style="max-width:640px; margin:0 auto;">
                <div class="card-header" style="background:#2980b9;color:white;">
                    <i class="fas fa-user-edit me-2"></i>Datos del Alumno
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/coordinacion/alumnos/guardar}" th:object="${alumno}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nombre *</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Apellido *</label>
                                <input type="text" th:field="*{apellido}" class="form-control" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Cédula *</label>
                                <input type="text" th:field="*{cedula}" class="form-control" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Teléfono</label>
                                <input type="text" th:field="*{telefono}" class="form-control"/>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" th:field="*{email}" class="form-control"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Fecha Nac.</label>
                                <input type="date" th:field="*{fechaNacimiento}" class="form-control"/>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Facultad</label>
                                <select th:field="*{facultad}" class="form-select">
                                    <option value="">-- Seleccione facultad --</option>
                                    <option th:each="f : ${facultades}"
                                            th:value="${f.id}"
                                            th:text="${f.nombre}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save me-1"></i>Guardar
                            </button>
                            <a th:href="@{/coordinacion/alumnos}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

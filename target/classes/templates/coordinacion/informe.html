<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Informe')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title">
                <i class="fas fa-file-alt me-2 text-info"></i>
                Informe Alumnos - Resultado <span th:text="${tipo}"></span>
            </h5>
        </div>
        <div class="content-area">
            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="px-4 py-3">#</th>
                                <th>Alumno</th>
                                <th>Cédula</th>
                                <th>Facultad</th>
                                <th>Puntaje Total</th>
                                <th>Lect. Crítica</th>
                                <th>Razon. Cuant.</th>
                                <th>Inglés</th>
                                <th>Periodo</th>
                                <th class="text-center">Beneficio</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r, i : ${resultados}">
                                <td class="px-4" th:text="${i.count}"></td>
                                <td th:text="${r.alumno.nombre + ' ' + r.alumno.apellido}"></td>
                                <td><code th:text="${r.alumno.cedula}"></code></td>
                                <td th:text="${r.alumno.facultad?.nombre}"></td>
                                <td><strong th:text="${r.puntajeTotal}"></strong></td>
                                <td th:text="${r.puntajeLecturaCritica}"></td>
                                <td th:text="${r.puntajeRazonamientoCuantitativo}"></td>
                                <td th:text="${r.puntajeIngles}"></td>
                                <td th:text="${r.periodo}"></td>
                                <td class="text-center">
                                    <span th:if="${r.tieneBeneficio}" class="badge bg-success"><i class="fas fa-award me-1"></i>Sí</span>
                                    <span th:unless="${r.tieneBeneficio}" class="badge bg-secondary">No</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(resultados)}">
                                <td colspan="10" class="text-center text-muted py-5">
                                    <i class="fas fa-file fa-3x mb-2 d-block"></i>No hay resultados registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

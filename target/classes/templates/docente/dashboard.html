<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Dashboard Docente')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-chalkboard-teacher me-2 text-success"></i>Dashboard Docente</h5>
            <small class="text-muted">Bienvenido, <span sec:authentication="name"></span></small>
        </div>
        <div class="content-area">
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="stat-card" style="background:linear-gradient(135deg,#27ae60,#196f3d);">
                        <div class="stat-num" th:text="${totalAlumnos}">0</div>
                        <div class="stat-label"><i class="fas fa-users me-1"></i>Total Alumnos</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="background:#1a3a5c;color:white;">
                    <i class="fas fa-bolt me-2"></i>Consultas Disponibles
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <a th:href="@{/docente/alumnos/facultad}" class="btn btn-outline-success w-100 py-3">
                                <i class="fas fa-building d-block mb-2" style="font-size:24px;"></i>Por Facultad
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/docente/alumnos/cedula}" class="btn btn-outline-primary w-100 py-3">
                                <i class="fas fa-id-card d-block mb-2" style="font-size:24px;"></i>Por Cédula
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/docente/informe/total}" class="btn btn-outline-info w-100 py-3">
                                <i class="fas fa-file-alt d-block mb-2" style="font-size:24px;"></i>Informe Total
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/docente/informe/beneficios}" class="btn btn-outline-warning w-100 py-3">
                                <i class="fas fa-award d-block mb-2" style="font-size:24px;"></i>Beneficios
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

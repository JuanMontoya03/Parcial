<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Buscar por Cédula')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-id-card me-2 text-primary"></i>Buscar Alumno por Cédula</h5>
        </div>
        <div class="content-area">
            <div class="card mb-4" style="max-width:500px;">
                <div class="card-body">
                    <form th:action="@{/docente/alumnos/cedula}" method="get" class="d-flex gap-3 align-items-end">
                        <div class="flex-grow-1">
                            <label class="form-label fw-semibold">Número de Cédula</label>
                            <input type="text" name="cedula" class="form-control"
                                   placeholder="Ej: 1098765432"
                                   th:value="${cedula}"/>
                        </div>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-search me-1"></i>Buscar
                        </button>
                    </form>
                </div>
            </div>

            <div class="card" th:if="${alumno != null}" style="max-width:600px;">
                <div class="card-header" style="background:#1a3a5c;color:white;">
                    <i class="fas fa-user-graduate me-2"></i>Información del Alumno
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="text-muted small mb-1">Nombre Completo</div>
                            <div class="fw-semibold" th:text="${alumno.nombre + ' ' + alumno.apellido}"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small mb-1">Cédula</div>
                            <div><code th:text="${alumno.cedula}"></code></div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small mb-1">Email</div>
                            <div th:text="${alumno.email ?: '—'}"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small mb-1">Facultad</div>
                            <div>
                                <span th:if="${alumno.facultad}" class="badge bg-primary" th:text="${alumno.facultad.nombre}"></span>
                                <span th:unless="${alumno.facultad}" class="text-muted">—</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small mb-1">Estado Saber Pro</div>
                            <div>
                                <span th:if="${alumno.aprobadoSaberPro}" class="badge bg-success"><i class="fas fa-check me-1"></i>Aprobado</span>
                                <span th:unless="${alumno.aprobadoSaberPro}" class="badge bg-warning text-dark">Pendiente</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small mb-1">Comprobante Pago</div>
                            <div th:text="${alumno.pagoSaberPro ?: 'No registrado'}" class="text-muted small"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="alert alert-warning mt-3" th:if="${cedula != null and alumno == null}">
                <i class="fas fa-exclamation-triangle me-2"></i>
                No se encontró ningún alumno con la cédula <strong th:text="${cedula}"></strong>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

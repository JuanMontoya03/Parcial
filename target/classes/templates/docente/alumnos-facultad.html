<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Alumnos por Facultad')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-building me-2 text-success"></i>Alumnos por Facultad</h5>
        </div>
        <div class="content-area">
            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/docente/alumnos/facultad}" method="get" class="d-flex gap-3 align-items-end">
                        <div class="flex-grow-1">
                            <label class="form-label fw-semibold">Seleccione Facultad</label>
                            <select name="facultadId" class="form-select">
                                <option value="">-- Seleccione --</option>
                                <option th:each="f : ${facultades}"
                                        th:value="${f.id}"
                                        th:text="${f.nombre}"
                                        th:selected="${facultadSeleccionada != null and facultadSeleccionada.id == f.id}">
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success px-4">
                            <i class="fas fa-search me-1"></i>Buscar
                        </button>
                    </form>
                </div>
            </div>

            <div class="card" th:if="${alumnos != null}">
                <div class="card-header" style="background:#27ae60;color:white;">
                    <i class="fas fa-users me-2"></i>
                    Alumnos de: <span th:text="${facultadSeleccionada?.nombre}"></span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="px-4 py-3">#</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Cédula</th>
                                <th>Email</th>
                                <th class="text-center">Saber Pro</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a, i : ${alumnos}">
                                <td class="px-4" th:text="${i.count}"></td>
                                <td th:text="${a.nombre}"></td>
                                <td th:text="${a.apellido}"></td>
                                <td><code th:text="${a.cedula}"></code></td>
                                <td th:text="${a.email}"></td>
                                <td class="text-center">
                                    <span th:if="${a.aprobadoSaberPro}" class="badge bg-success">Aprobado</span>
                                    <span th:unless="${a.aprobadoSaberPro}" class="badge bg-secondary">Pendiente</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alumnos)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox fa-2x mb-2 d-block"></i>No hay alumnos en esta facultad
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

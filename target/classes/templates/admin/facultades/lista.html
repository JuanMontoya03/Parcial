<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Facultades')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-university me-2" style="color:#f39c12;"></i>Gestión de Facultades</h5>
            <a th:href="@{/admin/facultades/nuevo}" class="btn btn-warning btn-sm text-white">
                <i class="fas fa-plus me-1"></i>Nueva Facultad
            </a>
        </div>
        <div class="content-area">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle me-2"></i><span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="px-4 py-3">#</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f, i : ${facultades}">
                                <td class="px-4" th:text="${i.count}"></td>
                                <td th:text="${f.nombre}"></td>
                                <td th:text="${f.descripcion}"></td>
                                <td class="text-center">
                                    <a th:href="@{/admin/facultades/editar/{id}(id=${f.id})}"
                                       class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></a>
                                    <a th:href="@{/admin/facultades/eliminar/{id}(id=${f.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('¿Eliminar esta facultad?')"><i class="fas fa-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(facultades)}">
                                <td colspan="4" class="text-center text-muted py-5">
                                    <i class="fas fa-inbox fa-3x mb-2 d-block"></i>No hay facultades registradas
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Facultad')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title">
                <i class="fas fa-university me-2" style="color:#f39c12;"></i>
                <span th:text="${facultad.id == null} ? 'Nueva Facultad' : 'Editar Facultad'"></span>
            </h5>
            <a th:href="@{/admin/facultades}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="content-area">
            <div class="card" style="max-width:580px; margin:0 auto;">
                <div class="card-header" style="background:#f39c12; color:white;">
                    <i class="fas fa-university me-2"></i>Datos de la Facultad
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/facultades/guardar}" th:object="${facultad}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre *</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-warning text-white px-4">
                                <i class="fas fa-save me-1"></i>Guardar
                            </button>
                            <a th:href="@{/admin/facultades}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

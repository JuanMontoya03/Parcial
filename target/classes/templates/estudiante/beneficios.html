<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Mis Beneficios')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-award me-2 text-warning"></i>Resolución Beneficios - Tecnología e Ingeniería</h5>
        </div>
        <div class="content-area">
            <div th:if="${resultados != null and not #lists.isEmpty(resultados)}">
                <div class="row g-4" th:each="r : ${resultados}">
                    <div class="col-md-6">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div style="width:48px;height:48px;background:linear-gradient(135deg,#f39c12,#d68910);
                                         border-radius:50%;display:flex;align-items:center;justify-content:center;
                                         color:white;font-size:20px;margin-right:14px;">
                                        <i class="fas fa-award"></i>
                                    </div>
                                    <div>
                                        <div class="fw-bold">Beneficio Saber Pro</div>
                                        <div class="text-muted small" th:text="${r.periodo}"></div>
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <span class="text-muted small">Puntaje Global:</span>
                                    <span class="badge bg-success ms-1" th:text="${r.puntajeTotal}"></span>
                                </div>
                                <div class="p-3 rounded" style="background:#fff8e1;border-left:4px solid #f39c12;">
                                    <div class="small text-muted mb-1">Resolución:</div>
                                    <div class="fw-semibold" th:text="${r.descripcionBeneficio}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="alert alert-info" th:if="${resultados == null or #lists.isEmpty(resultados)}">
                <i class="fas fa-info-circle me-2"></i>
                No tienes beneficios registrados actualmente.
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Pago Saber Pro')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-receipt me-2 text-info"></i>Cargue Pago Saber Pro</h5>
        </div>
        <div class="content-area">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle me-2"></i><span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="card" style="max-width:520px; margin:0 auto;">
                <div class="card-header" style="background:#2980b9;color:white;">
                    <i class="fas fa-upload me-2"></i>Registro de Comprobante de Pago
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info mb-4" style="border-radius:10px;">
                        <i class="fas fa-info-circle me-2"></i>
                        Ingresa el número o nombre de tu comprobante de pago del examen Saber Pro.
                    </div>

                    <!-- Estado actual -->
                    <div class="mb-4 p-3 rounded" style="background:#f8f9fb;"
                         th:if="${alumno != null and alumno.pagoSaberPro != null}">
                        <div class="text-muted small mb-1">Comprobante registrado actualmente:</div>
                        <div class="fw-semibold text-success">
                            <i class="fas fa-check-circle me-1"></i>
                            <span th:text="${alumno.pagoSaberPro}"></span>
                        </div>
                    </div>

                    <form th:action="@{/estudiante/pago/cargar}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Número / Referencia de Pago *</label>
                            <input type="text" name="comprobante" class="form-control form-control-lg"
                                   placeholder="Ej: PAY-2024-001234"
                                   required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="fas fa-save me-2"></i>Registrar Comprobante
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión | Saber Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #1a3a5c 0%, #0d2137 60%, #f39c12 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        .login-brand { text-align: center; margin-bottom: 32px; }
        .login-brand .icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #1a3a5c, #f39c12);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-size: 30px; color: white;
        }
        .login-brand h4 { color: #1a3a5c; font-weight: 700; margin: 0; }
        .login-brand p { color: #888; font-size: 13px; margin: 4px 0 0; }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 2px solid #e8ecf0;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #1a3a5c; box-shadow: none; }
        .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f8f9fa;
            border: 2px solid #e8ecf0;
            border-right: none;
            color: #1a3a5c;
        }
        .input-group .form-control { border-radius: 0 10px 10px 0; border-left: none; }
        .btn-login {
            background: linear-gradient(135deg, #1a3a5c, #0d2137);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,58,92,0.4); }
        .demo-box {
            background: #f8f9fb;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            font-size: 12px;
        }
        .demo-box h6 { color: #1a3a5c; font-weight: 700; font-size: 12px; margin-bottom: 10px; }
        .demo-user { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #ddd; }
        .demo-user:last-child { border: none; }
        .role-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-brand">
        <div class="icon"><i class="fas fa-graduation-cap"></i></div>
        <h4>SABER PRO</h4>
        <p>Sistema de Gestión de Exámenes</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 text-center" style="font-size:13px; border-radius:10px;">
        <i class="fas fa-exclamation-circle me-1"></i> Usuario o contraseña incorrectos
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 text-center" style="font-size:13px; border-radius:10px;">
        <i class="fas fa-check-circle me-1"></i> Sesión cerrada correctamente
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold" style="color:#1a3a5c; font-size:14px;">Usuario</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required/>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold" style="color:#1a3a5c; font-size:14px;">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-login text-white w-100">
            <i class="fas fa-sign-in-alt me-2"></i>Ingresar al Sistema
        </button>
    </form>

    <div class="demo-box">
        <h6><i class="fas fa-info-circle me-1 text-warning"></i>Usuarios de prueba</h6>
        <div class="demo-user">
            <span><code>admin</code> / <code>admin123</code></span>
            <span class="role-badge" style="background:#1a3a5c;color:white;">Admin</span>
        </div>
        <div class="demo-user">
            <span><code>coordinacion</code> / <code>coord123</code></span>
            <span class="role-badge bg-info text-white">Coord</span>
        </div>
        <div class="demo-user">
            <span><code>docente</code> / <code>docente123</code></span>
            <span class="role-badge bg-success text-white">Docente</span>
        </div>
        <div class="demo-user">
            <span><code>estudiante</code> / <code>est123</code></span>
            <span class="role-badge bg-secondary text-white">Estud.</span>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Mi Identificación')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-id-card me-2 text-secondary"></i>Mi Identificación</h5>
        </div>
        <div class="content-area">
            <div class="card" style="max-width:600px; margin:0 auto;" th:if="${alumno != null}">
                <div class="card-header" style="background:#1a3a5c;color:white; text-align:center;">
                    <i class="fas fa-graduation-cap me-2"></i>Carné Estudiantil - Saber Pro
                </div>
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div style="width:80px;height:80px;background:linear-gradient(135deg,#1a3a5c,#f39c12);
                             border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:36px;color:white;">
                            <i class="fas fa-user-graduate"></i>
                        </div>
                    </div>
                    <table class="table table-borderless">
                        <tr>
                            <td class="text-muted fw-semibold" style="width:40%">Nombre Completo</td>
                            <td th:text="${alumno.nombre + ' ' + alumno.apellido}" class="fw-bold"></td>
                        </tr>
                        <tr>
                            <td class="text-muted fw-semibold">Cédula</td>
                            <td><code th:text="${alumno.cedula}"></code></td>
                        </tr>
                        <tr>
                            <td class="text-muted fw-semibold">Email</td>
                            <td th:text="${alumno.email ?: '—'}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted fw-semibold">Teléfono</td>
                            <td th:text="${alumno.telefono ?: '—'}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted fw-semibold">Fecha Nacimiento</td>
                            <td th:text="${alumno.fechaNacimiento ?: '—'}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted fw-semibold">Facultad</td>
                            <td>
                                <span th:if="${alumno.facultad}" class="badge bg-primary" th:text="${alumno.facultad.nombre}"></span>
                                <span th:unless="${alumno.facultad}" class="text-muted">—</span>
                            </td>
                        </tr>
                        <tr>
                            <td class="text-muted fw-semibold">Estado Saber Pro</td>
                            <td>
                                <span th:if="${alumno.aprobadoSaberPro}" class="badge bg-success"><i class="fas fa-check me-1"></i>Aprobado</span>
                                <span th:unless="${alumno.aprobadoSaberPro}" class="badge bg-warning text-dark">Pendiente</span>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
            <div class="alert alert-warning" th:if="${alumno == null}">
                <i class="fas fa-exclamation-triangle me-2"></i>
                No se encontró información de alumno vinculada a tu cuenta. Contacta a coordinación.
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

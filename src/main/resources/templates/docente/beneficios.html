<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Beneficios')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-award me-2 text-warning"></i>Resolución Beneficios - Tecnología e Ingeniería</h5>
        </div>
        <div class="content-area">
            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="px-4 py-3">#</th>
                                <th>Alumno</th>
                                <th>Cédula</th>
                                <th>Facultad</th>
                                <th>Puntaje Total</th>
                                <th>Periodo</th>
                                <th>Descripción Beneficio</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r, i : ${resultados}">
                                <td class="px-4" th:text="${i.count}"></td>
                                <td th:text="${r.alumno.nombre + ' ' + r.alumno.apellido}"></td>
                                <td><code th:text="${r.alumno.cedula}"></code></td>
                                <td th:text="${r.alumno.facultad?.nombre}"></td>
                                <td><span class="badge bg-success" th:text="${r.puntajeTotal}"></span></td>
                                <td th:text="${r.periodo}"></td>
                                <td th:text="${r.descripcionBeneficio}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(resultados)}">
                                <td colspan="7" class="text-center text-muted py-5">
                                    <i class="fas fa-award fa-3x mb-2 d-block text-muted"></i>No hay beneficios registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Dashboard Admin')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: navbar}"></div>
    <div class="main-content w-100">
        <div class="topbar">
            <h5 class="page-title"><i class="fas fa-tachometer-alt me-2 text-warning"></i>Dashboard Administrador</h5>
            <small class="text-muted">Bienvenido, <span sec:authentication="name"></span></small>
        </div>
        <div class="content-area">

            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle me-2"></i><span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="stat-card" style="background: linear-gradient(135deg,#1a3a5c,#2d5f8a);">
                        <div class="stat-num" th:text="${totalDirectores}">0</div>
                        <div class="stat-label"><i class="fas fa-user-tie me-1"></i>Directores</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card" style="background: linear-gradient(135deg,#27ae60,#1e8449);">
                        <div class="stat-num" th:text="${totalDocentes}">0</div>
                        <div class="stat-label"><i class="fas fa-chalkboard-teacher me-1"></i>Docentes</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card" style="background: linear-gradient(135deg,#f39c12,#d68910);">
                        <div class="stat-num" th:text="${totalFacultades}">0</div>
                        <div class="stat-label"><i class="fas fa-university me-1"></i>Facultades</div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card">
                <div class="card-header" style="background:#1a3a5c; color:white;">
                    <i class="fas fa-bolt me-2"></i>Acciones Rápidas
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <a th:href="@{/admin/directores/nuevo}" class="btn btn-outline-primary w-100 py-3">
                                <i class="fas fa-plus-circle d-block mb-2" style="font-size:24px;"></i>
                                Nuevo Director
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/admin/docentes/nuevo}" class="btn btn-outline-success w-100 py-3">
                                <i class="fas fa-plus-circle d-block mb-2" style="font-size:24px;"></i>
                                Nuevo Docente
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/admin/facultades/nuevo}" class="btn btn-outline-warning w-100 py-3">
                                <i class="fas fa-plus-circle d-block mb-2" style="font-size:24px;"></i>
                                Nueva Facultad
                            </a>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/admin/beneficios}" class="btn btn-outline-info w-100 py-3">
                                <i class="fas fa-award d-block mb-2" style="font-size:24px;"></i>
                                Ver Beneficios
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
